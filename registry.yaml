# Реестр Аккаунтов
#
# Связывает Клиента с его Аккаунтами у Провайдеров.
# Правится людьми через PR. Агент в этот файл не пишет — см. docs/adr/0008.
#
# Реестр направляет агента, но ничего не запрещает на стороне сервера:
# ограничения по списку Аккаунтов у нас нет, см. docs/adr/0003.
#
# Идентификаторы:
#   google_ads     — customer_id, 10 цифр без дефисов
#   yandex_direct  — client_login
#   vk             — client_id

clients:
  - name: Пример Клиента
    # Комментарии полезны там, где Аккаунтов несколько и неочевидно, зачем.
    notes: Шаблонная запись. Удалите её при подключении первого реального Клиента.
    accounts:
      google_ads: "1234567890"
      yandex_direct: example-login
      vk: "987654321"
